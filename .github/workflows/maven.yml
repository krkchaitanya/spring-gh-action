name: Java CI with Maven and Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build JAR with Maven
        run: mvn -B clean package --file pom.xml

      - name: Build Docker image
        run: docker build -t spring-gh-action:latest .

      - name: Run Docker container
        run: |
          docker run -d --name spring-app -p 9900:9900 spring-gh-action:latest
          sleep 10
          docker ps

      - name: Show application logs
        if: always()
        run: docker logs spring-app